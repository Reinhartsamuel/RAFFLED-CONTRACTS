name: Deploy Raffled Keeper to VPS

on:
  push:
    branches: [main]
    paths:
      - "raffled-keeper/**"
      - ".github/workflows/deploy-keeper.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.VPS_PORT }}
          command_timeout: "20m"
          script: |
            set -e
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            cd /home/admin/repos/RAFFLED-CONTRACTS/raffled-keeper
            git fetch origin main
            git reset --hard origin/main
            if [ ! -f .env.local ]; then
              echo "Missing .env.local on VPS - copy .env.example and set RAFFLE_RPC_URL, RAFFLE_CONTRACT_ADDRESS, RAFFLE_RESOLVER_PRIVATE_KEY."
              exit 1
            fi
            npm ci
            npm run build
            pm2 delete raffled-keeper || true
            pm2 flush raffled-keeper || pm2 flush || true
            pm2 start ecosystem.config.cjs
            pm2 save
            echo "pm2 saved"
            echo "Waiting for keeper startup..."
            for i in $(seq 1 30); do
              # pm2 suffixes log files with the process id (raffled-keeper-out-5.log),
              # so resolve the newest matching files instead of assuming a name.
              OUT_LOG="$(ls -t "$HOME"/.pm2/logs/raffled-keeper-out*.log 2>/dev/null | head -n 1)"
              ERR_LOG="$(ls -t "$HOME"/.pm2/logs/raffled-keeper-error*.log 2>/dev/null | head -n 1)"
              LOGS=""
              if [ -n "$OUT_LOG" ]; then LOGS="$OUT_LOG"; fi
              if [ -n "$ERR_LOG" ]; then LOGS="$LOGS $ERR_LOG"; fi
              if [ -n "$OUT_LOG" ] && grep -q "raffled-keeper started" "$OUT_LOG" 2>/dev/null; then
                echo "Keeper is up."
                break
              fi
              # Alchemy being over its usage/quota limit is transient: the keeper
              # waits and retries in-process, so the deploy should not fail here.
              if [ -n "$LOGS" ] && grep -qiE "RPC unavailable|compute unit|capacity|quota|rate limit|too many requests|429|usage limit" $LOGS 2>/dev/null; then
                echo "Keeper is waiting on the RPC provider (Alchemy usage/quota limit). Deploy is OK; it will retry automatically."
                break
              fi
              if [ "$i" -eq 30 ]; then
                echo "Keeper did not report startup within 60s. Recent logs:"
                pm2 logs raffled-keeper --lines 50 --nostream
                exit 1
              fi
              sleep 2
            done
            echo "Keeper process status:"
            pm2 describe raffled-keeper | grep -E "status|uptime|restarts" || true
            echo "Recent keeper logs:"
            pm2 logs raffled-keeper --lines 20 --nostream 
